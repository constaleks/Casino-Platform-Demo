sonar.organization=constaleks
sonar.projectKey=constaleks_Casino-Platform-Demo
sonar.projectName=Casino Platform Demo

# What counts as production code vs test code (must not overlap)
sonar.sources=backend/app,backend/routes,backend/database,backend/config,frontend/src
sonar.tests=backend/tests

# Don't analyze generated/vendor code
sonar.exclusions=**/vendor/**,**/node_modules/**,backend/storage/**,backend/bootstrap/cache/**,backend/public/build/**,frontend/src/components/ui/**

# The frontend has no tests for now
sonar.coverage.exclusions=frontend/src/**

# Migrations look alike by nature, so don't flag them as duplication
sonar.cpd.exclusions=backend/database/migrations/**

# Coverage report produced by PHPUnit in CI
sonar.php.coverage.reportPaths=backend/coverage.xml
# Optional: test execution results (count, failures)
sonar.php.tests.reportPath=backend/junit.xml

sonar.sourceEncoding=UTF-8
