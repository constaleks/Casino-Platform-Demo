services:
    nginx:
        image: nginx:latest
        volumes:
            - ./backend:/var/www/backend
            - ./_docker/nginx/conf.d/:/etc/nginx/conf.d/
        ports:
            - '8876:80'
        depends_on:
            - app
        container_name: casino_nginx

    app:
        build:
            context: .
            dockerfile: _docker/php/Dockerfile
        volumes:
            - ./backend:/var/www/backend
        depends_on:
            db:
                condition: service_healthy
        env_file:
            - ./backend/.env
        container_name: casino_app
        user: '${UID}:${GID}'

    reverb:
        build:
            context: .
            dockerfile: _docker/php/Dockerfile
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        volumes:
            - ./backend:/var/www/backend
        depends_on:
            db:
                condition: service_healthy
        env_file:
            - ./backend/.env
        ports:
            - '8080:8080'
        container_name: casino_reverb
        user: '${UID}:${GID}'

    db:
        image: postgres:17-alpine
        restart: always
        volumes:
            - casino_db_data:/var/lib/postgresql/data
        environment:
            POSTGRES_DB: casino
            POSTGRES_USER: casino_user
            POSTGRES_PASSWORD: secret
        ports:
            - '8101:5432'
        container_name: casino_db
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U casino_user -d casino']
            interval: 5s
            timeout: 5s
            retries: 10

    pgadmin:
        image: dpage/pgadmin4
        restart: always
        ports:
            - '8102:80'
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@casino.local
            PGADMIN_DEFAULT_PASSWORD: admin
        depends_on:
            - db
        container_name: casino_pgadmin

    node:
        image: node:22-alpine
        working_dir: /app
        volumes:
            - ./frontend:/app
            - frontend_node_modules:/app/node_modules
        ports:
            - '5173:5173'
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        container_name: casino_node

volumes:
    casino_db_data:
    frontend_node_modules:
